name: Deploy Hosting

# Auto-deploy the Angular FE to Firebase Hosting on push to main.
# Auth: the Firebase Admin SDK service-account key (repo secret
# FIREBASE_SERVICE_ACCOUNT) — its roles/firebase.admin covers Hosting deploys.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'redesign/**'
  workflow_dispatch: {}

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Write service account key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Deploy hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx -y firebase-tools deploy --only hosting --project naikit-sticker --non-interactive
