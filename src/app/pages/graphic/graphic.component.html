<!--
  Designer picker modal — neo-brutalist restyle.
  No prototype mapping; styling adapted to the system (brutal cards on a
  yellow chrome header, ink border + brand-yellow shadow on hover).
-->
<div class="nk-content bg-surface-2">
  <div class="flex items-center justify-between gap-3 px-4 sm:px-6 py-3 sm:py-3.5 flex-shrink-0 bg-brand border-b-[3px] border-ink">
    <div class="min-w-0 flex-1">
      <div class="hidden sm:block label-eyebrow mb-0.5" style="opacity:.7">SELECT · เลือกผู้ออกแบบ</div>
      <h1 class="text-h1 tracking-tight truncate text-ink" style="margin:0;">เลือกผู้ออกแบบ</h1>
    </div>
    <app-button variant="ghost" size="sm" (clicked)="cancel()">ยกเลิก ✕</app-button>
  </div>

  <div class="p-5">
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
      <button
        *ngFor="let employee of option"
        type="button"
        (click)="onClickDesigner(employee)"
        class="h-32 rounded-lg border-2 border-ink bg-white shadow-brutal-sm flex flex-col items-center justify-center gap-2 cursor-pointer transition-all hover:shadow-brutal hover:-translate-x-px hover:-translate-y-px hover:bg-brand-50 focus:outline-none focus-visible:shadow-[3px_3px_0_var(--ink),0_0_0_3px_rgba(255,212,0,0.6)]"
      >
        <div class="w-10 h-10 rounded-full border-2 border-ink bg-brand flex items-center justify-center text-base font-extrabold">
          {{ (employee.title || '?').charAt(0).toUpperCase() }}
        </div>
        <div class="text-body-lg font-bold">{{ employee.title }}</div>
      </button>

      <div *ngIf="!option?.length" class="col-span-2 md:col-span-3 py-10 text-center text-body text-ink-4 font-medium">
        ไม่พบรายชื่อผู้ออกแบบ
      </div>
    </div>
  </div>
</div>
