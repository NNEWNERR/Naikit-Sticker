<div class="flex items-center justify-between gap-3 px-4 py-3 bg-brand border-b-[3px] border-ink">
  <h1 class="text-h1 m-0 truncate">{{ editData ? 'แก้ไขรายการงาน' : 'เพิ่มรายการงาน' }}</h1>
  <button type="button" (click)="closeModal()"
    class="btn-ghost px-3 py-1.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink focus-visible:ring-offset-2 focus-visible:ring-offset-brand">ปิด ✕</button>
</div>

<div class="nk-content bg-surface-2">
  <div class="max-w-3xl mx-auto px-4 py-5">
    <form [formGroup]="workItemForm" class="flex flex-col gap-5">

      <!-- ข้อมูลงาน -->
      <div class="bg-white border-2 border-ink rounded-lg p-4 md:p-5 shadow-brutal flex flex-col gap-3.5">
        <h3 class="text-h3 m-0">ข้อมูลงาน · Item</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
          <div>
            <label class="block text-body-sm font-extrabold mb-2">ประเภทงาน <span class="text-danger">*</span></label>
            <select formControlName="type"
              class="input-base focus-ring w-full font-semibold"
              [class.!border-danger]="workItemForm.get('type')?.invalid && workItemForm.get('type')?.touched">
              <option value="">เลือกประเภทงาน</option>
              <option *ngFor="let type of getWorkItemTypes()" [value]="type.value">{{ type.label }}</option>
            </select>
            <p *ngIf="workItemForm.get('type')?.invalid && workItemForm.get('type')?.touched"
              class="text-body-sm text-danger mt-1.5">กรุณาเลือกประเภทงาน</p>
          </div>

          <div *ngIf="hasPresetOptions(workItemForm.get('type')?.value)">
            <label class="block text-body-sm font-extrabold mb-2">ตัวเลือก <span class="text-danger">*</span></label>
            <select formControlName="option"
              class="input-base focus-ring w-full font-semibold"
              [class.!border-danger]="workItemForm.get('option')?.invalid && workItemForm.get('option')?.touched">
              <option value="">เลือกตัวเลือก</option>
              <option *ngFor="let opt of getWorkItemOptions(workItemForm.get('type')?.value)" [value]="opt.value">{{ opt.label }}</option>
            </select>
            <p *ngIf="workItemForm.get('option')?.invalid && workItemForm.get('option')?.touched"
              class="text-body-sm text-danger mt-1.5">กรุณาเลือกตัวเลือก</p>
          </div>

          <div *ngIf="!hasPresetOptions(workItemForm.get('type')?.value)">
            <label class="block text-body-sm font-extrabold mb-2">รายละเอียดเพิ่มเติม</label>
            <input type="text" formControlName="option"
              class="input-base focus-ring w-full font-semibold" placeholder="ระบุรายละเอียด" />
          </div>
        </div>
      </div>

      <!-- ขนาดและจำนวน -->
      <div class="bg-white border-2 border-ink rounded-lg p-4 md:p-5 shadow-brutal flex flex-col gap-3.5">
        <h3 class="text-h3 m-0">ขนาดและจำนวน · Size & Qty</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3.5">
          <div>
            <label class="block text-body-sm font-extrabold mb-2">ความสูง <span class="text-danger">*</span></label>
            <input type="text" inputmode="decimal" formControlName="height"
              class="input-base focus-ring w-full font-num font-semibold"
              [class.!border-danger]="workItemForm.get('height')?.invalid && workItemForm.get('height')?.touched"
              placeholder="0.00" />
            <p *ngIf="workItemForm.get('height')?.invalid && workItemForm.get('height')?.touched"
              class="text-body-sm text-danger mt-1.5">กรุณากรอกความสูง</p>
          </div>

          <div>
            <label class="block text-body-sm font-extrabold mb-2">ความยาว <span class="text-danger">*</span></label>
            <input type="text" inputmode="decimal" formControlName="width"
              class="input-base focus-ring w-full font-num font-semibold"
              [class.!border-danger]="workItemForm.get('width')?.invalid && workItemForm.get('width')?.touched"
              placeholder="0.00" />
            <p *ngIf="workItemForm.get('width')?.invalid && workItemForm.get('width')?.touched"
              class="text-body-sm text-danger mt-1.5">กรุณากรอกความยาว</p>
          </div>

          <div>
            <label class="block text-body-sm font-extrabold mb-2">หน่วย <span class="text-danger">*</span></label>
            <select formControlName="unit_of_length"
              class="input-base focus-ring w-full font-semibold"
              [class.!border-danger]="workItemForm.get('unit_of_length')?.invalid && workItemForm.get('unit_of_length')?.touched">
              <option *ngFor="let unit of getUnitOptions()" [value]="unit.value">{{ unit.label }}</option>
            </select>
            <p *ngIf="workItemForm.get('unit_of_length')?.invalid && workItemForm.get('unit_of_length')?.touched"
              class="text-body-sm text-danger mt-1.5">กรุณาเลือกหน่วย</p>
          </div>

          <div>
            <label class="block text-body-sm font-extrabold mb-2">จำนวน <span class="text-danger">*</span></label>
            <input type="text" inputmode="numeric" formControlName="quantity" min="1"
              class="input-base focus-ring w-full font-num font-semibold"
              [class.!border-danger]="workItemForm.get('quantity')?.invalid && workItemForm.get('quantity')?.touched"
              placeholder="1" />
            <p *ngIf="workItemForm.get('quantity')?.invalid && workItemForm.get('quantity')?.touched"
              class="text-body-sm text-danger mt-1.5">กรุณากรอกจำนวน</p>
          </div>
        </div>
      </div>

      <!-- ราคาและหมายเหตุ -->
      <div class="bg-white border-2 border-ink rounded-lg p-4 md:p-5 shadow-brutal flex flex-col gap-3.5">
        <h3 class="text-h3 m-0">ราคาและหมายเหตุ · Price</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
          <div>
            <label class="block text-body-sm font-extrabold mb-2">ราคา (฿) <span class="text-danger">*</span></label>
            <input type="text" inputmode="decimal" formControlName="total" min="0"
              class="input-base focus-ring w-full font-num font-bold"
              [class.!border-danger]="workItemForm.get('total')?.invalid && workItemForm.get('total')?.touched"
              placeholder="0.00" />
            <p *ngIf="workItemForm.get('total')?.invalid && workItemForm.get('total')?.touched"
              class="text-body-sm text-danger mt-1.5">กรุณากรอกราคา</p>
            <p class="text-body-sm text-ink-3 mt-1.5">เว้นว่าง/0 = รอประเมินราคา</p>
          </div>
          <div>
            <label class="block text-body-sm font-extrabold mb-2">หมายเหตุ</label>
            <textarea formControlName="remark" rows="3"
              class="input-base focus-ring w-full font-semibold resize-none"
              placeholder="ระบุหมายเหตุ (ถ้ามี)"></textarea>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="nk-footer">
  <div class="p-4 bg-white border-t-2 border-ink">
    <div class="max-w-3xl mx-auto flex justify-end gap-3">
      <button type="button" (click)="dismiss()"
        class="btn-ghost px-6 py-2.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink focus-visible:ring-offset-2">
        ยกเลิก
      </button>
      <button type="submit" (click)="save()" [disabled]="!workItemForm.valid"
        class="btn-primary px-6 py-2.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ink focus-visible:ring-offset-2">
        บันทึก
      </button>
    </div>
  </div>
</div>
