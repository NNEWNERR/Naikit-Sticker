<!--
  Image viewer modal — neo-brutalist restyle.
  Dark backdrop keeps the focus on the image; brutal close button top-right.
-->
<div class="nk-content bg-ink">
  <button
    type="button"
    (click)="close()"
    class="absolute top-4 right-4 z-10 w-11 h-11 rounded-full bg-brand border-2 border-ink shadow-brutal-sm flex items-center justify-center cursor-pointer text-base font-extrabold focus:outline-none focus-visible:shadow-[3px_3px_0_var(--ink),0_0_0_3px_rgba(255,212,0,0.6)]"
    aria-label="ปิด"
  >✕</button>

  <div class="min-h-[100dvh] flex items-center justify-center p-4 md:p-8">
    <img
      [src]="image"
      alt="Preview"
      class="max-w-full max-h-[90dvh] object-contain border-2 border-brand rounded-md shadow-brutal-brand"
    />
  </div>
</div>
