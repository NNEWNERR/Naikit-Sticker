<!-- Group management — brutal table inside the setting shell. -->
<div class="flex justify-between items-center mb-4 gap-2 flex-wrap">
  <h3 class="text-h2 m-0">กลุ่มสิทธิ์</h3>
  <app-button variant="primary" size="sm" (clicked)="add()">➕ เพิ่มกลุ่ม</app-button>
</div>

<div class="flex items-center gap-2 bg-white border-2 border-ink rounded-md px-3 py-2 shadow-brutal-sm mb-4 max-w-md">
  <span aria-hidden="true">🔍</span>
  <input
    type="search"
    (input)="handleInput($event)"
    placeholder="ค้นหา ชื่อกลุ่ม..."
    class="bg-transparent border-0 outline-none flex-1 text-body font-semibold placeholder:text-ink-4"
  />
</div>

<div class="border-2 border-ink rounded-md overflow-x-auto md:overflow-hidden">
  <div class="grid grid-cols-[80px_1fr_60px] md:grid-cols-[100px_1fr_140px_44px]
              bg-ink text-brand text-[11px] font-extrabold min-w-[260px] md:min-w-0">
    <div class="px-3 py-2.5">Group ID</div>
    <div class="px-3 py-2.5">ชื่อกลุ่ม</div>
    <div class="px-3 py-2.5">สี</div>
    <div class="hidden md:block px-3 py-2.5"></div>
  </div>

  <div
    *ngFor="let g of results; let i = index"
    class="grid grid-cols-[80px_1fr_60px] md:grid-cols-[100px_1fr_140px_44px]
           border-t border-line items-center min-w-[260px] md:min-w-0"
    [class.bg-surface-2]="i % 2 === 1"
    [class.bg-white]="i % 2 === 0"
  >
    <div class="px-3 py-2.5 text-body font-num text-ink-3 truncate">{{ g.id }}</div>
    <div class="px-3 py-2.5 text-body-lg font-bold truncate">{{ g.name }}</div>
    <div class="px-3 py-2.5 flex items-center gap-2">
      <span
        *ngIf="g.color"
        class="w-5 h-5 rounded border-2 border-ink flex-shrink-0"
        [style.background]="g.color"
        [attr.aria-label]="g.color"
      ></span>
      <span class="text-body-sm font-num text-ink-3 hidden md:inline">{{ g.color || '—' }}</span>
    </div>
    <div class="hidden md:block px-2 py-2.5 text-center">
      <button
        type="button"
        (click)="edit(g)"
        class="text-[18px] text-ink-3 hover:text-ink cursor-pointer bg-transparent border-0"
        aria-label="แก้ไข"
      >✏️</button>
    </div>
  </div>

  <div *ngIf="results.length === 0" class="py-10 text-center text-body text-ink-4 font-medium border-t border-line">
    ไม่พบกลุ่ม
  </div>
</div>
