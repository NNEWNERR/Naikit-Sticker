<!--
  QR Code viewer modal — neo-brutalist restyle.
  No prototype mapping; container styled with the brutal language. QR
  rendering + download logic unchanged.
-->
<div class="nk-content bg-surface-2">
  <!-- Header -->
  <div class="flex items-center justify-between gap-3 px-4 sm:px-6 py-3 sm:py-3.5 flex-shrink-0 bg-brand border-b-[3px] border-ink">
    <div class="min-w-0 flex-1">
      <div class="hidden sm:block label-eyebrow mb-0.5 opacity-70">QR CODE · {{ site?.name }}</div>
      <h1 class="text-h1 tracking-tight truncate text-ink m-0">{{ site?.name || 'QR Code' }}</h1>
    </div>
    <app-button variant="ghost" size="sm" (clicked)="closeModal()">ปิด ✕</app-button>
  </div>

  <div class="p-5 flex justify-center">
    <div class="w-full max-w-md">
      <!-- Loading state when group hasn't resolved yet -->
      <div *ngIf="!group" class="py-12 text-center text-body text-ink-4 font-medium">
        กำลังโหลด...
      </div>

      <!-- QR card -->
      <div *ngIf="group" class="bg-white border-2 border-ink rounded-lg p-5 shadow-brutal flex flex-col items-center gap-4">
        <!-- QR canvas -->
        <div class="bg-white border-2 border-ink rounded-md p-2 shadow-brutal-sm">
          <qrcode #parent
            [elementType]="elementType"
            [errorCorrectionLevel]="errorCorrectionLevel"
            [qrdata]="qrdata"
            [scale]="scale"
            [width]="width"
            [allowEmptyString]="true"
            [className]="cssClass"
            [colorDark]="colorDark"
            [colorLight]="colorLight"
            [margin]="margin"
            [alt]="alt"
            [ariaLabel]="ariaLabel"
            [title]="title"
            [imageSrc]="imageSrc"
            [imageHeight]="imageHeight"
            [imageWidth]="imageWidth"
            (qrCodeURL)="onChangeURL($event)">
          </qrcode>
        </div>

        <!-- Group row -->
        <div class="flex items-center gap-3">
          <span class="w-7 h-7 rounded-full border-2 border-ink flex-shrink-0" [style.background]="group?.color"></span>
          <span class="text-h3">{{ group?.name }}</span>
        </div>

        <!-- Download -->
        <ng-container *ngIf="elementType !== 'svg'">
          <app-button variant="dark" size="md" (clicked)="saveAsImage(parent)">
            📥 ดาวน์โหลด QR Code
          </app-button>
        </ng-container>
        <a
          *ngIf="elementType === 'svg'"
          [href]="qrCodeSrc"
          [attr.download]="site?.name"
          class="btn-dark inline-flex"
        >📥 ดาวน์โหลด QR Code</a>
      </div>
    </div>
  </div>
</div>
