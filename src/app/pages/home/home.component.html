<!--
  Home / Dashboard — role-aware kanban (desktop) + list (mobile).
  Data from JobsService.watchMyJobs() — role determines both the Firestore
  query and the visible column set. Admin retains the team-filter chip strip.
-->
<div class="nk-content bg-surface-2">

  <!-- ── Page header ──────────────────────────────────────────────────── -->
  <app-page-header
    breadcrumb="DASHBOARD · ใบงานวันนี้"
    title="ใบงานวันนี้"
    [subtitle]="todayLabel"
    [yellow]="true"
  >
    <div header-right class="flex items-center gap-2.5">
      <div class="hidden md:block w-64">
        <app-search
          label="ค้นหา serial หรือชื่อลูกค้า"
          placeholder="ค้นหา serial / ลูกค้า..."
          name="home-search-desktop"
          [maxWidth]="false"
          [value]="search"
          (valueChange)="search = $event">
        </app-search>
      </div>
      <app-button *ngIf="canRecordPayment" variant="ghost" size="md" (clicked)="goCombinedPayment()">
        💳 <span class="hidden md:inline">จ่ายรวม</span>
      </app-button>
      <app-button *ngIf="canCreate" variant="dark" size="md" (clicked)="createWorkSheet()">
        ➕ <span class="hidden md:inline">สร้างใบงาน</span>
      </app-button>
    </div>
  </app-page-header>

  <!-- Listener error — shown on both layouts when the jobs query is rejected -->
  <div *ngIf="loadError" class="mx-6 my-3 px-4 py-3 bg-red-50 border-2 border-red-300 rounded-md text-body-sm text-red-800 font-bold">
    ⚠️ {{ loadError }}
  </div>

  <!-- ── DESKTOP: stats + team filter (admin only) + kanban ───────────── -->
  <div class="hidden md:flex md:flex-col px-6 py-4 gap-4">

    <!-- Stat row -->
    <div class="flex gap-3">
      <app-stat-card label="ใบงานทั้งหมด" icon="📋" [value]="totalCount" delta="งานในระบบ" deltaTone="neutral"></app-stat-card>
      <app-stat-card label="งานด่วน ⚡" icon="🔥" [value]="urgentCount" delta="ต้องเร่ง" deltaTone="danger"></app-stat-card>
      <app-stat-card label="รอออกแบบ" icon="🎨" [value]="pendingDesignCount"></app-stat-card>
      <app-stat-card label="กำลังผลิต" icon="🖨️" [value]="printingCount"></app-stat-card>
      <app-stat-card label="ส่งมอบแล้ว" icon="✅" [value]="deliveredCount" deltaTone="success"></app-stat-card>
    </div>

    <!-- Team filter — admin only -->
    <div *ngIf="isAdmin" class="flex items-center gap-2">
      <span class="text-[11px] font-extrabold text-ink-3 tracking-wider mr-1">ทีม:</span>
      <app-segmented
        size="md"
        [value]="team"
        [options]="[
          { key: 'all',        label: 'ทั้งหมด',  count: jobs.length },
          { key: 'seller',     label: 'ฝ่ายขาย' },
          { key: 'graphic',    label: 'กราฟิก' },
          { key: 'production', label: 'ผลิต' }
        ]"
        (change)="setTeam($event)"
      ></app-segmented>
    </div>

    <!-- Machine/type filter — ฝ่ายผลิต/กราฟิก/แอดมิน (ดูง่ายว่างานเครื่องไหน) -->
    <div *ngIf="showMachineFilter" class="flex items-center gap-2">
      <span class="text-[11px] font-extrabold text-ink-3 tracking-wider mr-1">เครื่อง:</span>
      <app-segmented size="md" [value]="machineFilter" [options]="machineOptions" (change)="setMachine($event)"></app-segmented>
    </div>

    <!-- Loading skeleton -->
    <app-skeleton *ngIf="isLoading" variant="list" [rows]="3" ariaLabel="กำลังโหลดใบงาน"></app-skeleton>

    <!-- Kanban board -->
    <div *ngIf="!isLoading" class="flex gap-3.5 overflow-x-auto pb-2">
      <app-kanban-column
        *ngFor="let s of visibleColumns"
        [status]="s"
        [items]="byStatus(s)"
        (open)="openWorksheet($event)"
      ></app-kanban-column>
    </div>
  </div>

  <!-- ── MOBILE: stats + filter chips + list ──────────────────────────── -->
  <div class="md:hidden flex flex-col">

    <!-- Stat tiles -->
    <div class="px-3.5 pt-3 pb-2 grid grid-cols-3 gap-2">
      <app-stat-card size="sm" label="ทั้งหมด" [value]="totalCount"></app-stat-card>
      <app-stat-card size="sm" label="ด่วน ⚡" [value]="urgentCount" tone="danger"></app-stat-card>
      <app-stat-card size="sm" label="ส่งแล้ว" [value]="deliveredCount" tone="success"></app-stat-card>
    </div>

    <!-- Mobile search -->
    <div class="px-3.5 pb-2">
      <app-search
        label="ค้นหา serial หรือชื่อลูกค้า"
        placeholder="ค้นหา serial / ลูกค้า..."
        name="home-search-mobile"
        [maxWidth]="false"
        [value]="search"
        (valueChange)="search = $event">
      </app-search>
    </div>

    <!-- Role-aware filter chips -->
    <div class="px-3.5 pb-2.5 overflow-x-auto">
      <app-segmented
        size="sm"
        [value]="mobileTab"
        [options]="mobileTabs"
        (change)="setMobileTab($event)"
      ></app-segmented>
    </div>

    <!-- Machine/type filter (ฝ่ายผลิต/กราฟิก/แอดมิน) -->
    <div *ngIf="showMachineFilter" class="px-3.5 pb-2.5 overflow-x-auto">
      <app-segmented size="sm" [value]="machineFilter" [options]="machineOptions" (change)="setMachine($event)"></app-segmented>
    </div>

    <!-- Card list -->
    <div class="px-3.5 pb-6 flex flex-col">
      <app-skeleton *ngIf="isLoading" variant="list" [rows]="4" ariaLabel="กำลังโหลดใบงาน"></app-skeleton>

      <ng-container *ngIf="!isLoading">
        <app-kanban-card
          *ngFor="let j of mobileList; trackBy: trackByKey"
          [ws]="j"
          (open)="openWorksheet($event)"
        ></app-kanban-card>

        <app-empty-state
          *ngIf="mobileList.length === 0"
          icon="📭"
          [title]="search ? 'ไม่พบใบงานที่ค้นหา' : 'ยังไม่มีใบงาน'"
          [helper]="search ? 'ลองค้นหาด้วยคำอื่น หรือเปลี่ยนตัวกรอง' : 'ยังไม่มีงานในคิวของคุณ'"
          [cta]="canCreate && !search ? 'สร้างใบงานใหม่' : ''"
          (ctaClick)="createWorkSheet()">
        </app-empty-state>
      </ng-container>
    </div>
  </div>
</div>
