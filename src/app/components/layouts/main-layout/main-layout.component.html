<!--
  Authenticated chrome wrapping every route under /naikit-sticker/*.
  See src/app/shared/chrome/ for the three building-block components.

  The previous Ionic <ion-split-pane> + <ion-menu> shell is replaced by
  <app-shell>, which handles the desktop sidebar vs mobile drawer +
  bottom-nav switch responsively (md breakpoint, matching the prototype's
  useIsMobile = window.innerWidth < 768).

  Pages render in <ion-router-outlet> — kept (not swapped for <router-outlet>)
  so existing pages that rely on Ionic page lifecycle hooks keep working.
-->
<app-shell
  [navItems]="navItems"
  [bottomNavItems]="primaryTabs"
  [userName]="userName"
  [userRole]="userRole"
  [hasTopbar]="false"
  (logoutRequested)="logout()"
>
  <ion-router-outlet id="main-content"></ion-router-outlet>
</app-shell>
